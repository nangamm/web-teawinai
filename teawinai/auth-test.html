<!DOCTYPE html>
<html>
<head>
    <title>Auth Test</title>
</head>
<body>
    <h1>Authentication Test</h1>
    <div id="results"></div>
    
    <script>
        function checkAuth() {
            const results = document.getElementById('results');
            
            // Check token
            const token = localStorage.getItem('token');
            results.innerHTML += '<p>Token exists: ' + !!token + '</p>';
            
            if (token) {
                try {
                    // Decode JWT
                    const payload = token.split('.')[1];
                    if (payload) {
                        const decoded = JSON.parse(atob(payload));
                        results.innerHTML += '<p>User: ' + JSON.stringify(decoded, null, 2) + '</p>';
                        results.innerHTML += '<p>Role: ' + decoded.role + '</p>';
                        results.innerHTML += '<p>Is Admin: ' + (decoded.role === 'admin') + '</p>';
                    }
                } catch (error) {
                    results.innerHTML += '<p>Error: ' + error.message + '</p>';
                }
            }
            
            // Test login
            results.innerHTML += '<h2>Test Steps:</h2>';
            results.innerHTML += '<ol>';
            results.innerHTML += '<li>Go to http://localhost:3000/login</li>';
            results.innerHTML += '<li>Login with: admin@teawinai.com / Admin1234</li>';
            results.innerHTML += '<li>Check if "แอดมิน" button appears in navbar</li>';
            results.innerHTML += '<li>Try accessing http://localhost:3000/admin</li>';
            results.innerHTML += '<li>Try accessing http://localhost:3000/admin/manage</li>';
            results.innerHTML += '</ol>';
        }
        
        checkAuth();
    </script>
</body>
</html>
